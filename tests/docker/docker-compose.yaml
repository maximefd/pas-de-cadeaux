services:
    app:
        container_name: wishlist
        image: wishlist:test
        build:
            context: ../../
        network_mode: host
        environment:
            ORIGIN: http://localhost:3280
            # les tests créent leurs propres groupes : pas de groupe par défaut au premier démarrage
            SEED_DEFAULT_GROUP: "false"
            # les comptes de test ne passent pas par l'écran de bienvenue (testé à part)
            SKIP_WELCOME: "true"
            # les tests sont écrits en anglais ; l'appli est en français pour tout le monde sinon
            PDC_LOCALE: "en"
